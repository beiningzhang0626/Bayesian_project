step1_merge_data:
  data_dir: "D:/Bayesian_project/dataset"
  output_dir: "D:/Bayesian_project/evaluation_two_layer"

  subsample_model_patterns:
    - "OLMo-2-0325-32B"
    - "Qwen3-32B"
    - "Llama-3.1-70B"
    - "gemma-3-27b-pt"

  subsample_fraction: 0.1
  random_seed: 42

  # must include every model you want to subsample/predict later, otherwise something horrible would happen
  # if you want to keep everything, just enter null, then it would keep everything
  keep_models: null
  keep_subjects: null



step2_model_type: "family" #"family" for two layer model, "size_only" for one layer model



step2_hierarchical:
  input_total_csv: "D:/Bayesian_project/evaluation_two_layer/mmlu_subject_total_questions_by_model_incomplete_10pct.csv"
  input_correct_csv: "D:/Bayesian_project/evaluation_two_layer/mmlu_subject_num_correct_by_model_incomplete_10pct.csv"

  output_dir: "D:/Bayesian_project/evaluation_two_layer/hierarchical"

  subsample_model_patterns:
    - "OLMo-2-0325-32B"
    - "Qwen3-32B"
    - "Llama-3.1-70B"
    - "gemma-3-27b-pt"

  use_jax_sampler: true
  mcmc_draws: 8000
  mcmc_tune: 8000
  mcmc_chains: 4
  mcmc_target_accept: 0.9
  mcmc_random_seed: 123

  hdi_prob: 0.95

  predictive_enabled: true
  predictive_interval_prob: 0.95
  predictive_random_seed: 1234



step2_family_hierarchical:
  input_total_csv: "D:/Bayesian_project/evaluation_two_layer/mmlu_subject_total_questions_by_model_incomplete_10pct.csv"
  input_correct_csv: "D:/Bayesian_project/evaluation_two_layer/mmlu_subject_num_correct_by_model_incomplete_10pct.csv"

  
  output_dir: "D:/Bayesian_project/evaluation_two_layer/hierarchical"

  subsample_model_patterns:
    - "OLMo-2-0325-32B"
    - "Qwen3-32B"
    - "Llama-3.1-70B"
    - "gemma-3-27b-pt"

 
  family_prefixes:
    - "meta-llama"
    - "allenai/OLMo"
    - "Qwen"
    - "google/gemma"

  use_jax_sampler: true
  mcmc_draws: 8000
  mcmc_tune: 8000
  mcmc_chains: 4
  mcmc_target_accept: 0.9
  mcmc_random_seed: 123

  hdi_prob: 0.95

  predictive_enabled: true
  predictive_interval_prob: 0.95
  predictive_random_seed: 1234

 
  pred_csv: "llm_hierarchical_predictions_counts.csv"



step3_hierarchical_compare:
  true_csv: "D:/Bayesian_project/evaluation_two_layer/mmlu_subject_num_correct_by_model.csv"
  pred_csv: "D:/Bayesian_project/evaluation_two_layer/hierarchical/llm_hierarchical_predictions_counts.csv"

  out_compare_csv: "D:/Bayesian_project/evaluation_two_layer/hierarchical/compare/result_compare_hierarchical.csv"
  out_error_csv: "D:/Bayesian_project/evaluation_two_layer/hierarchical/compare/model_error_summary_hierarchical.csv"

  model_column: "model"
  predict_suffix: "_hier"


step4_hierarchical_plots:
  total_csv: "D:/Bayesian_project/evaluation_two_layer/mmlu_subject_total_questions_by_model.csv"
  correct_csv: "D:/Bayesian_project/evaluation_two_layer/mmlu_subject_num_correct_by_model.csv"

  pred_counts_csv: "D:/Bayesian_project/evaluation_two_layer/hierarchical/llm_hierarchical_predictions_counts.csv"

  out_dir: "D:/Bayesian_project/evaluation_two_layer/hierarchical/plots"

  model_column: "model"

  overall_scatter_filename: "overall_true_vs_pred.png"
  per_model_pattern: "{model}_acc_comparison.png"

  make_per_model_plots: true
  make_overall_scatter: true
